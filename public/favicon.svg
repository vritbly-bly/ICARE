<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
  <defs>
    <linearGradient id="favBlueArc" x1="60" y1="20" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c0ff" />
      <stop offset="35%" stop-color="#0077e6" />
      <stop offset="70%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#002b80" />
    </linearGradient>

    <linearGradient id="favAmberArc" x1="40" y1="110" x2="100" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077e6" />
      <stop offset="30%" stop-color="#ffb300" />
      <stop offset="75%" stop-color="#ff8f00" />
      <stop offset="100%" stop-color="#ff5722" />
    </linearGradient>

    <linearGradient id="favHandOrange" x1="70" y1="180" x2="250" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8500" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#d83b01" />
    </linearGradient>

    <linearGradient id="favScreenBezel" x1="100" y1="50" x2="220" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="favChassisGrad" x1="80" y1="130" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="favTrackpadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0099ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0077cc" />
    </linearGradient>

    <linearGradient id="favPixelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#005ec4" />
    </linearGradient>
  </defs>

  <!-- 1. UPPER 'C' ARC (Royal Blue to Cyan) -->
  <path
    d="M 235 28 C 130 5, 54 65, 56 160 C 56 172, 60 186, 66 196 C 74 180, 82 158, 88 136 C 94 80, 142 42, 225 50 Z"
    fill="url(#favBlueArc)"
  />

  <!-- 2. MID-LEFT TRANSITION (Amber-Yellow Blend) -->
  <path
    d="M 58 152 C 60 178, 70 200, 84 216 C 90 202, 95 180, 93 160 C 88 148, 76 142, 65 142 C 61 145, 59 148, 58 152 Z"
    fill="url(#favAmberArc)"
  />

  <!-- 3. BOTTOM SUPPORTING HAND (Cupping from Underneath) -->
  <path
    d="M 68 185 C 74 218, 105 254, 172 256 C 210 257, 245 235, 258 208 C 250 210, 240 215, 226 220 C 185 230, 146 215, 118 198 C 136 208, 175 212, 210 204 C 228 200, 245 190, 250 180 C 234 188, 212 192, 192 190 C 146 186, 116 162, 98 142 C 86 148, 76 164, 68 185 Z"
    fill="url(#favHandOrange)"
  />

  <!-- Hand White Highlights -->
  <path
    d="M 182 214 C 206 214, 230 203, 248 184"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.95"
  />
  <path
    d="M 214 222 C 232 218, 248 204, 256 192"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- 4. CENTRAL OPEN LAPTOP -->
  <rect x="115" y="68" width="128" height="88" rx="7" fill="url(#favScreenBezel)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="122" y="75" width="114" height="74" rx="3" fill="#ffffff" />
  <polygon points="122,75 188,75 160,149 122,149" fill="#f8fafc" opacity="0.6" />
  <circle cx="179" cy="71" r="2" fill="#475569" />

  <!-- Laptop Base -->
  <polygon
    points="90,168 268,168 250,155 108,155"
    fill="url(#favChassisGrad)"
    stroke="#475569"
    stroke-width="1"
  />
  <polygon
    points="110,162 248,162 244,156 114,156"
    fill="#0f172a"
  />
  <line x1="112" y1="159" x2="246" y2="159" stroke="#334155" stroke-width="0.8" />
  <rect x="156" y="163" width="46" height="5" rx="1.5" fill="url(#favTrackpadGrad)" />

  <!-- 5. FLOATING PIXEL CLOUD -->
  <rect x="258" y="52" width="16" height="16" rx="2" fill="url(#favPixelGrad)" />
  <rect x="242" y="58" width="10" height="10" rx="1.5" fill="url(#favPixelGrad)" />
  <rect x="264" y="74" width="15" height="15" rx="2" fill="url(#favPixelGrad)" />
  <rect x="238" y="74" width="12" height="12" rx="1.5" fill="url(#favPixelGrad)" />
  <rect x="215" y="80" width="9" height="9" rx="1.2" fill="url(#favPixelGrad)" />
  <rect x="228" y="88" width="11" height="11" rx="1.5" fill="url(#favPixelGrad)" />
  <rect x="248" y="96" width="12" height="12" rx="1.5" fill="url(#favPixelGrad)" />
  <rect x="265" y="92" width="14" height="14" rx="2" fill="url(#favPixelGrad)" />
  <rect x="194" y="82" width="7" height="7" rx="1" fill="url(#favPixelGrad)" />
  <rect x="203" y="92" width="9" height="9" rx="1.2" fill="url(#favPixelGrad)" />
  <rect x="252" y="112" width="11" height="11" rx="1.5" fill="url(#favPixelGrad)" />
</svg>
